kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4 # <--- THIS IS THE CORRECT API VERSION FOR KIND CLUSTER CONFIG
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
    # listenAddress: "0.0.0.0" # Optional
  - containerPort: 443
    hostPort: 443
    protocol: TCP
    # listenAddress: "0.0.0.0" # Optional
  # Optional explicit API server mapping:
  # - containerPort: 6443
  #   hostPort: 6443 # Ensure this is free
  #   protocol: TCP
  #   listenAddress: "127.0.0.1"
